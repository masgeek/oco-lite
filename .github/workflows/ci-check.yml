name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check (oco-lite.mjs + every src/**/*.mjs module)
        run: pnpm test

      - name: Smoke test (exercises the full module import graph)
        run: node oco-lite.mjs --help

      - name: Verify package.json is valid
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"

      - name: Security audit (production only)
        run: pnpm audit --production

      - name: Dry-run pack (fails if 'files' list or bin path is broken)
        run: pnpm pack --pack-destination /tmp

      - name: Upload npm pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-pack
          path: /tmp/*.tgz
