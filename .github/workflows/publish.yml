name: Publish to npm

on:
  release:
    types: [published]
  # push:
  #   tags:
  #     - '*'
  workflow_dispatch:

# Deliberately tag-push only, not also `release: types: [published]` — a
# GitHub Release that creates a new tag already triggers this via the tag
# push itself, so keeping both would fire `npm publish` twice for the same
# version (a guaranteed race once .github/workflows/bump-and-tag.yml
# auto-creates both a tag and a release together on every push to main).
#
# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# One-time setup: publish the first version manually with a token, then
# configure the Trusted Publisher on npmjs.com -> package settings ->
# Trusted Publisher, pointing at this repo + this workflow filename.

permissions:
  contents: read
  id-token: write   # required — this is what lets npm mint the OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Syntax check (oco-lite.mjs + every src/**/*.mjs module)
        run: pnpm test

      - name: Smoke test (exercises the full module import graph)
        run: node oco-lite.mjs --help
      - name: Configure npm for scoped package
        run: npm config set @masgeek:registry https://registry.npmjs.org/

      - name: Pin package.json version to the release tag
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          # The tag (created automatically by .github/workflows/bump-and-tag.yml,
          # computed from commit messages) is the source of truth for the
          # release version, not package.json — that action only tags, it never
          # bumps package.json. So we patch the version here in the CI checkout,
          # right before publishing, instead of requiring it to already match.
          # This is NOT committed back to git — main's package.json keeps
          # whatever version a human last set via `pnpm version`.
          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG_VERSION' is not a plain semver version (expected e.g. 1.2.3)."
            exit 1
          fi
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.TAG_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "package.json version set to $TAG_VERSION for this publish."

      - name: Publish (Trusted Publishing / OIDC)
        run: npm publish --provenance --access public
        # Deliberately `npm publish`, not `pnpm publish` — Trusted Publishing
        # here relies on npm CLI v11+'s auto-detection of the GitHub Actions
        # OIDC context (no NODE_AUTH_TOKEN needed), which is tied to the
        # Trusted Publisher config on npmjs.com for this exact repo + workflow
        # file. Switching package managers for this one step risks breaking
        # that OIDC handshake, so every other step uses pnpm but this one stays npm.